<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <!-- Background (transparent — inherits plugin window colour) -->

  <!-- Accent bar: left vertical green line -->
  <rect x="0" y="8" width="4" height="64" fill="#44ff44" rx="2"/>

  <!-- FREECODER wordmark — monospace stencil aesthetic -->
  <text
    x="18" y="56"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="46"
    font-weight="bold"
    letter-spacing="2"
    fill="#ffffff">FREECODER</text>

  <!-- Subtle green underline/glow bar -->
  <rect x="18" y="62" width="374" height="2" fill="#44ff44" rx="1" opacity="0.7"/>

  <!-- Small "SPECTRAL MORPH WORKSTATION" subtitle -->
  <text
    x="20" y="76"
    font-family="'Courier New', 'Lucida Console', monospace"
    font-size="9"
    letter-spacing="3"
    fill="#44ff44"
    opacity="0.75">SPECTRAL MORPH WORKSTATION</text>
</svg>
