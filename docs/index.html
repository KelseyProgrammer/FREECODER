<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ament Audio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      padding: 80px 20px 60px;
      text-align: center;
      border-bottom: 1px solid #1a1a1a;
    }

    .logo {
      font-size: 3.2rem;
      font-weight: bold;
      letter-spacing: 0.35em;
      color: #39ff6a;
      text-shadow: 0 0 20px #39ff6a88, 0 0 60px #39ff6a44;
    }

    .tagline {
      margin-top: 14px;
      font-size: 0.88rem;
      letter-spacing: 0.2em;
      color: #555;
      text-transform: uppercase;
    }

    main {
      max-width: 720px;
      width: 100%;
      padding: 72px 20px 80px;
    }

    .section-title {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      color: #39ff6a;
      text-transform: uppercase;
      margin-bottom: 24px;
      border-left: 2px solid #39ff6a;
      padding-left: 10px;
    }

    .products {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .product-card {
      background: #111;
      border: 1px solid #1e1e1e;
      border-radius: 6px;
      padding: 28px 28px 24px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
    }

    .product-info {
      flex: 1;
    }

    .product-name-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .product-name {
      font-size: 1.1rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      color: #39ff6a;
      text-transform: uppercase;
    }

    .price-badge {
      font-size: 0.72rem;
      padding: 2px 8px;
      background: #39ff6a22;
      border: 1px solid #39ff6a44;
      border-radius: 3px;
      color: #39ff6a;
      letter-spacing: 0.1em;
    }

    .product-desc {
      font-size: 0.82rem;
      color: #666;
      line-height: 1.6;
    }

    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.15s;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-secondary {
      background: transparent;
      color: #39ff6a;
      border: 1px solid #39ff6a44;
    }

    .btn-secondary:hover {
      border-color: #39ff6a;
      background: #39ff6a11;
    }

    footer {
      width: 100%;
      padding: 32px 20px;
      text-align: center;
      border-top: 1px solid #1a1a1a;
      font-size: 0.72rem;
      color: #333;
      letter-spacing: 0.1em;
      margin-top: auto;
    }

    footer a {
      color: #444;
      text-decoration: none;
    }

    footer a:hover { color: #39ff6a; }

    @media (max-width: 500px) {
      .logo { font-size: 2rem; }
      .product-card { flex-direction: column; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">AMENT AUDIO</div>
  <div class="tagline">precision tools for sound design</div>
</header>

<main>

  <div class="section-title">Products</div>
  <div class="products">
    <div class="product-card">
      <div class="product-info">
        <div class="product-name-row">
          <span class="product-name">FREECODER</span>
          <span class="price-badge">$29</span>
        </div>
        <div class="product-desc">Spectral morphing workstation — capture any sound and use it as a living spectral donor for freeze, granular, phrase loop, and MIDI instrument processing.</div>
      </div>
      <a class="btn btn-secondary" href="freecoder.html">VIEW PLUGIN &rarr;</a>
    </div>
  </div>

</main>

<footer>
  &copy; 2026 Ament Audio &nbsp;&middot;&nbsp;
  <a href="https://github.com/KelseyProgrammer/FREECODER">GitHub</a>
</footer>

</body>
</html>
